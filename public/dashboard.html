<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paijo Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d0f14; color: #e0e0e0; font-family: 'Courier New', monospace; padding: 16px; line-height: 1.5; }
    .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid #1a1d26; margin-bottom: 16px; }
    .header h1 { color: #ff6b6b; font-size: 18px; }
    .header a { color: #4ecdc4; text-decoration: none; font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
    .card { background: #141721; border: 1px solid #1f2330; border-radius: 6px; padding: 14px; }
    .card h2 { font-size: 13px; color: #4ecdc4; text-transform: uppercase; margin-bottom: 10px; border-bottom: 1px dashed #1f2330; display: flex; justify-content: space-between; }
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat { text-align: center; padding: 10px; background: #0d0f14; border-radius: 4px; }
    .stat .num { font-size: 22px; color: #ff6b6b; font-weight: bold; }
    .stat .label { font-size: 10px; color: #666; }
    .provider { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1a1d26; font-size: 12px; }
    .status { padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
    .available { background: #1a3d2b; color: #4ecdc4; }
    .rate_limited { background: #3d2a1a; color: #f4a460; }
    .error { background: #3d1a1a; color: #ff6b6b; }
    .refresh-btn { background: #1a1d26; color: #4ecdc4; border: 1px solid #2a2f42; padding: 4px 12px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🦞 PAJIO DASHBOARD</h1>
    <div>
      <button class="refresh-btn" onclick="refreshAll()">↻ Refresh</button>
      <a href="/" style="margin-left: 12px;">← Chat</a>
    </div>
  </div>

  <div class="grid">
    <!-- Health State Card (BARU) -->
    <div class="card">
      <h2>🏥 Health State</h2>
      <div class="stat-grid">
        <div class="stat">
          <div class="num" id="health-last-good" style="font-size: 14px; word-break: break-all;">-</div>
          <div class="label">Last Good Model</div>
        </div>
        <div class="stat">
          <div class="num" id="health-cooldown">-</div>
          <div class="label">Model Cooldown</div>
        </div>
      </div>
    </div>

    <!-- Providers Card -->
    <div class="card">
      <h2>⚡ Providers <span class="badge" id="provider-count"></span></h2>
      <div id="providers"><div class="loading">Loading...</div></div>
    </div>

    <!-- Stats Card -->
    <div class="card">
      <h2>📁 Vault Stats</h2>
      <div class="stat-grid">
        <div class="stat"><div class="num" id="stat-md">-</div><div class="label">.md files</div></div>
        <div class="stat"><div class="num" id="stat-folders">-</div><div class="label">folders</div></div>
        <div class="stat"><div class="num" id="stat-skills">-</div><div class="label">skills</div></div>
      </div>
    </div>
  </div>

  <script>
    async function loadHealth() {
      try {
        const r = await fetch('/api/health');
        const data = await r.json();
        document.getElementById('health-last-good').textContent = data.lastGoodModel ? `${data.lastGoodModel.provider}/${data.lastGoodModel.model}` : 'None';
        document.getElementById('health-cooldown').textContent = data.cooldownCount;
      } catch (e) { console.error(e); }
    }

    async function loadStatus() {
      try {
        const r = await fetch('/api/status');
        const data = await r.json();
        const providers = data.providers || [];
        document.getElementById('provider-count').textContent = providers.length + ' total';
        if (!providers.length) return;
        
        providers.sort((a, b) => (a.status === 'available' ? -1 : 1));
        document.getElementById('providers').innerHTML = providers.map(p => `
          <div class="provider">
            <div><div>${p.provider}/${p.model} ${p.keyId!=null?'#'+p.keyId:''}</div><div style="font-size:10px;color:#666;">${p.usage?.requests||0} req</div></div>
            <span class="status ${p.status}">${p.status}</span>
          </div>
        `).join('');
      } catch (e) { console.error(e); }
    }

    async function loadStats() {
      try {
        const r = await fetch('/api/stats');
        const data = await r.json();
        document.getElementById('stat-md').textContent = data.mdCount || 0;
        document.getElementById('stat-folders').textContent = data.folderCount || 0;
        const sk = await (await fetch('/api/skills')).json();
        document.getElementById('stat-skills').textContent = sk.total || 0;
      } catch (e) { console.error(e); }
    }

    function refreshAll() { loadHealth(); loadStatus(); loadStats(); }
    refreshAll();
    setInterval(refreshAll, 10000);
  </script>
</body>
</html>
